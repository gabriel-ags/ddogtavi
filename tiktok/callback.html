<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDOGTAVI Uploader · Connecting TikTok</title>
<link rel="icon" href="../favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="32x32" href="../img/icon-32.png"><link rel="apple-touch-icon" href="../img/icon-180.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f5f0ff; font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
         background: radial-gradient(1200px 600px at 50% -10%, #5a1350, transparent 60%), linear-gradient(180deg, #2a0b3d, #0b0716 55%); }
  .card { max-width: 460px; margin: 16px; padding: 28px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; } p { color: #b9a8d6; margin: 0; } .err { color: #ff9cc4; }
  a { color: #22d3ee; }
</style>
</head>
<body>
<div class="card">
  <h1 id="t">Connecting your TikTok account…</h1>
  <p id="m">Finishing the login with the DDOGTAVI Uploader on this computer.</p>
</div>
<script>
// TikTok leitet mit ?code&state hierher zurück. Der Code wird an den lokalen Helfer gegeben, der ihn (mit dem
// Client-Secret, das diesen PC nie verlässt) gegen ein Token tauscht. Danach zurück zur Post-Seite.
const API = 'http://127.0.0.1:8724';
const q = new URLSearchParams(location.search);
const fail = (msg) => { document.getElementById('t').textContent = 'Login not completed'; const m = document.getElementById('m'); m.className = 'err'; m.innerHTML = msg + ' <a href="./">Back to the uploader</a>'; };
(async () => {
  if (q.get('error')) return fail('TikTok reported: ' + (q.get('error_description') || q.get('error')) + '.');
  if (!q.get('code')) return fail('No login data received.');
  try {
    const s = await (await fetch(API + '/api/session')).json();
    const r = await fetch(API + '/api/auth/finish', {method: 'POST', headers: {'content-type': 'application/json', 'x-session': s.session}, body: JSON.stringify({code: q.get('code'), state: q.get('state')})});
    const b = await r.json().catch(() => ({}));
    if (!r.ok) return fail(b.error || 'The uploader could not finish the login.');
    document.getElementById('t').textContent = 'TikTok account connected ✅';
    document.getElementById('m').textContent = 'Taking you back to the uploader…';
    setTimeout(() => location.replace('./?connected=1'), 1200);
  } catch {
    let saved = null;
    try { saved = sessionStorage.getItem('ddog_state'); } catch {}
    if (saved && saved === q.get('state')) {
      document.getElementById('t').textContent = 'Logged in with TikTok ✅';
      document.getElementById('m').innerHTML = 'TikTok confirmed the login. To finish connecting and post videos, start the DDOGTAVI Uploader on the owner&#39;s computer. <a href="./">Back to the uploader</a>';
      return;
    }
    fail('The DDOGTAVI Uploader is not running on this computer.');
  }
})();
</script>
</body>
</html>
